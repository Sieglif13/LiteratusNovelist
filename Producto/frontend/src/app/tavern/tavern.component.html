<div class="tavern-wrapper">
  <div class="tavern-header">
    <h1 class="tavern-title">La Taberna del Viajero</h1>
    <p class="tavern-subtitle">Un lugar de encuentro para mentes brillantes. Próximamente: Chat y Multijugador.</p>
  </div>
  
  <div class="game-wrapper">
    <div class="game-frame">
      <div #gameContainer class="phaser-container"></div>
    </div>
    
    <div class="tavern-sidebar glass-panel">
      <h3 class="sidebar-title">En la sala</h3>
      <ul class="user-list">
        <li class="user-item">
          <div class="user-avatar" style="background-color: #8B0000;"></div>
          <span class="user-name">Tú (Viajero)</span>
        </li>
      </ul>
      <div class="chat-placeholder">
        <p class="chat-info">El chat de proximidad se activará cuando los assets estén listos.</p>
      </div>
    </div>
  </div>
</div>
