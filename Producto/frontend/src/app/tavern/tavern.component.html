<div class="tavern-wrapper">
  <div class="game-wrapper">
    <div class="game-frame">
      <div #gameContainer class="phaser-container"></div>
      
      <!-- CHAT CON SÓCRATES (MVP) -->
      <div class="chat-overlay" *ngIf="isChatOpen">
        <div class="chat-window">
          <div class="chat-header">
            <div class="chat-title">
              <span class="npc-avatar">🎅</span>
              <h3>Hablando con Sócrates</h3>
            </div>
            <button class="close-btn" (click)="closeChat()">✕</button>
          </div>
          
          <div class="chat-messages">
            <div *ngFor="let msg of chatMessages" class="chat-bubble-wrap" [class.is-user]="msg.sender === 'You'">
              <div class="chat-bubble">
                <span class="sender-name">{{ msg.sender === 'You' ? 'Tú' : 'Sócrates' }}</span>
                <p>{{ msg.text }}</p>
              </div>
            </div>
            <div class="chat-bubble-wrap" *ngIf="isWaitingResponse">
              <div class="chat-bubble">
                <span class="sender-name">Sócrates</span>
                <p class="typing">Escribiendo<span class="dots">...</span></p>
              </div>
            </div>
          </div>
          
          <div class="chat-input-area">
            <input type="text" 
                   #msgInput
                   [value]="currentMessage" 
                   (input)="currentMessage = msgInput.value"
                   (keyup.enter)="sendMessage()"
                   placeholder="Escribe tu mensaje..." 
                   [disabled]="isWaitingResponse" 
                   class="chat-input"
                   autocomplete="off" />
            <button (click)="sendMessage()" 
                    [disabled]="!currentMessage.trim() || isWaitingResponse" 
                    class="send-btn">
              Enviar <span class="ink-cost">-5 💧</span>
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <div class="tavern-sidebar glass-panel" [class.collapsed]="!sidebarOpen">
      <button class="toggle-sidebar-btn" (click)="toggleSidebar()">
        {{ sidebarOpen ? 'Cerrar' : 'Menú' }}
      </button>
      
      <div class="sidebar-content" *ngIf="sidebarOpen">
        <h3 class="sidebar-title">En la sala</h3>
        <ul class="user-list">
          <li class="user-item" *ngIf="isLoggedIn">
            <div class="user-avatar" style="background-color: #8B0000;"></div>
            <span class="user-name">Tú (Viajero)</span>
          </li>
          <li class="user-item" *ngIf="!isLoggedIn">
            <span class="user-name">Inicia sesión para entrar</span>
          </li>
        </ul>
        <div class="chat-placeholder" *ngIf="isLoggedIn">
          <p class="chat-info">El chat de proximidad se activará pronto.</p>
        </div>
      </div>
    </div>
  </div>
</div>
