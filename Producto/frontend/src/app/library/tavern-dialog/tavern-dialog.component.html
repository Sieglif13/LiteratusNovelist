<div class="tavern-modal">
  <button class="close-btn" (click)="closeDialog()">X</button>
  
  <div class="tavern-header">
    <div class="ink-logo">💧</div>
    <h2 class="tavern-title">La Taberna del Autor</h2>
    <p class="tavern-subtitle">Tu tintero actual tiene <strong class="glow-text">{{ inkBalance$ | async }} gotas</strong></p>
  </div>

  <div class="tavern-body">
    <!-- Recompensa diaria -->
    <div class="daily-reward" (click)="claimDailyDrop()">
      <div class="reward-icon">🎁</div>
      <div class="reward-info">
        <h3>Gota de Tinta Diaria</h3>
        <p>Reclama 5 gotas gratis cada 24 horas.</p>
      </div>
      <button class="claim-btn">Reclamar</button>
    </div>

    <div class="divider"><span>o llena tu tintero</span></div>

    <!-- Packs de Tinta -->
    <div class="ink-packs">
      <div class="ink-pack" (click)="buyInkPack(50)">
        <div class="pack-amount">50 💧</div>
        <div class="pack-price">$1.99</div>
      </div>
      <div class="ink-pack popular" (click)="buyInkPack(200)">
        <div class="popular-badge">Recomendado</div>
        <div class="pack-amount">200 💧</div>
        <div class="pack-price">$4.99</div>
      </div>
      <div class="ink-pack mega" (click)="buyInkPack(500)">
        <div class="pack-amount">500 💧</div>
        <div class="pack-price">$9.99</div>
      </div>
    </div>
  </div>
</div>
