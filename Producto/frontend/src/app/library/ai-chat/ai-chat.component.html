<div class="chat-wrapper">
  
  <!-- Cabecera de controles -->
  <div class="chat-header glass-panel">
    <div class="mode-selector">
      <button [class.active]="activeMode === 'roleplay'" (click)="setMode('roleplay')">🎭 Roleplay Pura</button>
      <button [class.active]="activeMode === 'tutor'" (click)="setMode('tutor')">🎓 Tutor Académico</button>
      <button [class.active]="activeMode === 'critical'" (click)="setMode('critical')">👁️ Lector Crítico</button>
    </div>

    <!-- Toggle Voz Local -->
    <div class="voice-controls">
      <label class="switch-label">
        <span class="label-text">Voz Real-Time (Local)</span>
        <div class="switch" [class.on]="realTimeVoiceActive" (click)="toggleVoice()"
             [class.disabled]="realTimeVoiceActive && !(piperReady$ | async)">
          <div class="slider"></div>
        </div>
      </label>

      <div class="status-indicators">
        <div class="loading-indicator" *ngIf="realTimeVoiceActive && !(piperReady$ | async)">
          <span class="spinner"></span> Cargando red neuronal en memoria... {{ piperProgress$ | async }}%
        </div>
        <div class="speaking-indicator" *ngIf="piperSpeaking$ | async">
          🔊 Sintetizando audio (ONNX)...
        </div>
      </div>
    </div>
  </div>

  <!-- Ventana de Chat Inmersiva -->
  <div class="chat-window glass-panel">
    <div class="message-feed">
      
      <div *ngFor="let msg of messages" 
           class="chat-bubble" 
           [ngClass]="msg.sender === 'user' ? 'user-bubble' : 'ai-bubble'">
        {{ msg.text }}
      </div>

      <div *ngIf="isWriting" class="chat-bubble ai-bubble typing">
        El Avatar está meditando...
      </div>
      
    </div>

    <!-- Input inferior -->
    <div class="input-area">
      <input type="text" class="glass-input chat-input" 
             placeholder="Habla con tu obra literaria..." 
             [(ngModel)]="newMessage" 
             (keyup.enter)="sendMessage()">
      <button class="send-btn glass-btn" (click)="sendMessage()">Enviar</button>
    </div>
  </div>
</div>
